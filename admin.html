<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8faff"><title>CS Admin Panel</title><link rel="stylesheet" href="style.css"></head><body class="admin-page">
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">CS</span><span>CS <b>Admin Panel</b></span></a><a class="top-link" href="index.html">Sign out</a></header>
<main class="admin-shell"><div class="admin-heading"><div><p class="eyebrow">CONTROL CENTER</p><h1>Login Activity</h1><p class="muted">All recorded login attempts from the shared Google Sheet.</p></div><button class="outline" id="refreshBtn">↻ Refresh</button></div>
<div class="stats"><div class="stat"><span>Total records</span><strong id="totalCount">—</strong></div><div class="stat"><span>Admin attempts</span><strong id="adminCount">—</strong></div><div class="stat"><span>Other users</span><strong id="userCount">—</strong></div></div>
<div class="table-card"><div class="table-head"><h2>Recent activity</h2><span id="updatedAt" class="muted small-note"></span></div><div class="table-wrap"><table><thead><tr><th>Date & Time</th><th>Username</th><th>Full Name</th><th>Type</th><th>Status</th></tr></thead><tbody id="logRows"><tr><td colspan="5" class="empty">Loading records…</td></tr></tbody></table></div></div><p id="adminStatus" class="message" role="status"></p></main>
<footer>CS Secure Login · Admin</footer><script src="config.js"></script><script src="admin.js"></script></body></html>
